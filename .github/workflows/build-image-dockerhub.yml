name: Build and Push to Docker Hub

# Builds the image on GitHub's runners and pushes it to Docker Hub.
# No local Docker daemon needed.
# Requires two repo secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (linux/amd64 for the cluster)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/c2ai-llm-demo:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/c2ai-llm-demo:latest

      - name: Show the image reference
        run: echo "Pushed ${{ secrets.DOCKERHUB_USERNAME }}/c2ai-llm-demo:v1"
